default:
  default_args:
    owner: airflow
    start_date: 2025-11-01

spark_pipeline:
    description: Spark job pipeline
    schedule_interval: null
    catchup: false
    tags:
      - dag_factory

    tasks:
      spark_etl:
        operator: airflow.operators.bash.BashOperator
        bash_command: |
          spark-submit \
            --master local[*] \
            --conf spark.executor.memory=4g \
            --conf spark.driver.memory=2g \
            --conf spark.sql.adaptive.enabled=true \
            /opt/airflow/include/scripts/spark_job.py