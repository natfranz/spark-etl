version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-webserver
    command: bash -c "airflow db init && airflow users create --role Admin --username airflow --email airflow@example.com --firstname airflow --lastname airflow --password airflow 2>/dev/null; airflow webserver"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_CONN_SPARK_DEFAULT: spark://localhost:7077?deploy_mode=client
      AIRFLOW_HOME: /opt/airflow
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-arm64
      PYTHONPATH: /opt/airflow/include:/opt/airflow
    volumes:
      - ${PWD}/dags:/opt/airflow/dags
      - ${PWD}/include:/opt/airflow/include
      - ${PWD}/logs:/opt/airflow/logs
      - ${PWD}/res:/opt/airflow/data
      - ${PWD}/res/output:/opt/airflow/data/output
      - ${PWD}/airflow:/opt/airflow/config
      - ${PWD}/tests:/opt/airflow/tests
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    command: airflow scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_CONN_SPARK_DEFAULT: spark://localhost:7077?deploy_mode=client
      AIRFLOW_HOME: /opt/airflow
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-arm64
      PYTHONPATH: /opt/airflow/include:/opt/airflow
    volumes:
      - ${PWD}/dags:/opt/airflow/dags
      - ${PWD}/include:/opt/airflow/include
      - ${PWD}/logs:/opt/airflow/logs
      - ${PWD}/res:/opt/airflow/data
      - ${PWD}/res/output:/opt/airflow/data/output
      - ${PWD}/airflow:/opt/airflow/config
      - ${PWD}/tests:/opt/airflow/tests
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres-db-volume:
